<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#17191d" />
    <meta name="description" content="Write, preview, and organize your Markdown notes in Mireth, a calm personal notebook for thoughts worth keeping." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mireth" />
    <meta property="og:title" content="Mireth — Private Markdown Notes" />
    <meta property="og:description" content="A calmer space to write, preview, and organize your Markdown notes." />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Mireth — Private Markdown Notes" />
    <meta name="twitter:description" content="A calmer space to write, preview, and organize your Markdown notes." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Mireth | Private Markdown Notes</title>

    <script>
      try {
        if (
          localStorage.getItem("theme") === "dark" ||
          (!("theme" in localStorage) &&
            window.matchMedia("(prefers-color-scheme: dark)").matches)
        ) {
          document.documentElement.classList.add("dark");
        } else {
          document.documentElement.classList.remove("dark");
        }
      } catch (_) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
